name: ci

# Every push and every pull request. The tests are the specification here —
# `foldrun check`'s rules, the grammar, the runner's contracts — so a red
# build is a broken promise, not a style complaint. When main passes, the
# repositories built on core re-run their own CI against it (dependents).
on:
  push:
    branches: [main]
  pull_request:
  # release-pr.yml starts it on release/next: its own push starts nothing.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push/PR update cancels the older one (FOL-62, box runner).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The security gate every foldrun repo runs (.githooks/security.sh, synced
  # from foldrun-infra): secrets in the push and the tree, Semgrep, npm audit
  # and registry signatures, a CycloneDX SBOM kept as an artifact. No secrets
  # here, so a fork's pull request runs it too.
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install (no scripts) — this repo and its nested apps
        run: for d in . */; do [ -f "$d/package-lock.json" ] && [ "$d" != node_modules/ ] && (cd "$d" && npm ci --ignore-scripts --no-audit --no-fund); done; true
      - name: security gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .githooks/security.sh "$BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('sbom/*.cdx.json') != ''
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  test:
    # GitHub's hosted runner: this repository is public (25 Oct 2026), and a
    # public repository never runs on our own machines — a pull request from
    # a fork would run its code there. Hosted minutes are free for public
    # repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on push to main; the supported floor only on PRs (FOL-62).
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["22", "24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  # core's main passed: re-run the CI of the repositories that build on it,
  # against this commit (FOL-92 — on 23 Oct the CLI went red against core
  # main while its own CI stayed green, because nothing re-ran it). A
  # `core-main` repository_dispatch to each, with the sha; each one's ci.yml
  # checks core out at it. As the foldrun-bot App, the way release.yml tells
  # the CLI about a release: a dispatch needs contents: write on the target,
  # which GITHUB_TOKEN never has on another repository. One token per
  # repository, so one the App cannot reach does not stop the others; a
  # failure here is a warning, never a red core — each dependent also runs
  # nightly against core's main.
  dependents:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repo: [foldrun-cli, foldrun-platform, foldrun-web]
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot
        continue-on-error: true
        with:
          client-id: ${{ vars.FOLDRUN_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FOLDRUN_BOT_PRIVATE_KEY }}
          owner: foldrun-io
          repositories: ${{ matrix.repo }}
          permission-contents: write
      - name: re-run ${{ matrix.repo }} against this core
        if: steps.bot.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ github.sha }}
        run: |
          for n in 1 2 3; do
            gh api "repos/foldrun-io/$REPO/dispatches" -f event_type=core-main -f "client_payload[sha]=$SHA" && exit 0
            if [ "$n" -lt 3 ]; then sleep $((n * 10)); fi
          done
          echo "::warning::could not dispatch $REPO — its nightly run tests against core's main"
      - name: no token for ${{ matrix.repo }}
        if: steps.bot.outputs.token == ''
        run: echo "::warning::the foldrun-bot App gave no token for ${{ matrix.repo }} — its nightly run tests against core's main"

  # The release pull request passed: wake release-merge.yml (27 Oct 2026).
  # Its own workflow_run never fires for this run — GITHUB_TOKEN started it —
  # but a workflow_dispatch from GITHUB_TOKEN does. release-merge checks the
  # evidence itself; this only says "look now".
  release-hint:
    needs: test
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'release/next' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref_name == 'release/next')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        # GitHub answers this with a 5xx now and then (4 Nov 2026). This job is
        # part of ci, and release-merge.yml merges only on a green ci, so a red
        # hint held release 14.3.3 for an hour. Three tries, then a warning:
        # release-merge's own schedule merges the release anyway.
        run: |
          for n in 1 2 3; do
            gh workflow run release-merge.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            if [ "$n" -lt 3 ]; then sleep $((n * 20)); fi
          done
          echo "::warning::could not start release-merge.yml — its schedule merges this release"
