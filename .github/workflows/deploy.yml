name: deploy

# A push to main asks the box to deploy (foldrun-infra box-deploy.yml,
# `repository_dispatch: deploy`). The box deploy is the gate: it builds the
# version from the five repos' main, runs the deploy checks, waits for runs
# in flight, rolls out, and tags the version (vYYYY.MM.DD.N). Its 30-minute
# schedule stays as the safety net — GitHub fires schedules late or not at
# all when busy (3 Oct: nothing between 18:26Z and 23:30Z).
#
# Dispatching to another repository needs a token that can write to
# foldrun-infra. Preferred: the foldrun-bot GitHub App (vars.FOLDRUN_BOT_CLIENT_ID
# + secrets.FOLDRUN_BOT_PRIVATE_KEY, foldrun-infra github/app-secrets.sh): a
# token minted per run, an hour long, Contents write on foldrun-infra only.
# Until the App is set up, secret DEPLOY_DISPATCH_TOKEN. Neither: this says
# so and the schedule still deploys.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: a token for foldrun-infra, from the App
        id: app
        if: vars.FOLDRUN_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FOLDRUN_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FOLDRUN_BOT_PRIVATE_KEY }}
          owner: foldrun-io
          repositories: foldrun-infra
          permission-contents: write

      - name: ask the box to deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::neither the foldrun-bot App nor DEPLOY_DISPATCH_TOKEN is set — the box picks this up on its schedule instead"
            exit 0
          fi
          gh api -X POST repos/foldrun-io/foldrun-infra/dispatches \
            -f event_type=deploy \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[sha]=$GITHUB_SHA"
          echo "deploy requested for $GITHUB_REPOSITORY@${GITHUB_SHA:0:7}"
