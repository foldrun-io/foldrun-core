name: Proposal
description: Something the runtime should be able to do
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: >
        The job, not the feature. Several proposals usually turn out to be
        the same problem, and the shared answer is better than any of them.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Including "nothing, I gave up" — that is useful.
  - type: textarea
    id: shape
    attributes:
      label: What it might look like in a file
      description: Markdown, if you have a shape in mind.
      render: markdown
